<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalmPath</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            CalmPath
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search destination...">
        </div>

        <div class="header-right">
            ⚙️
        </div>

    </header>


    <div class="container">

        <aside class="sidebar">

            <h3>Navigation</h3>

            <ul>

                <li>🗺 Route Planner</li>

                <li>🌳 Quiet Refuges</li>

                <li>📢 Predictive Alerts</li>

                <li>⚙ Settings</li>

            </ul>

        </aside>
 
        <main class="main-content">

            <h1>Component Preview</h1>

            <br>

            <div class="card">

                <h2>Buttons</h2>

                <br>

                <button class="btn btn-primary">
                    Primary Button
                </button>

                <button class="btn btn-secondary">
                    Secondary
                </button>

            </div>

            <br>

            <div class="card">

                <h2>Search Box</h2>

                <br>

                <input
                    class="input"
                    placeholder="Search destination..."
                >

            </div>

            <br>

            <div class="card">

                <h2>Sensory Badge</h2>

                <br>

                <span class="badge low">
                    LOW
                </span>


                <span class="badge high">
                    HIGH
                </span>

                <span class="badge limited">
                    LIMITED DATA
                </span>

            </div>

        </main>

    </div>

</body>

</html>
